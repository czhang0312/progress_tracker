default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>

development:
  <<: *default
  database: progress_tracker_development
  username: <%= ENV.fetch("DATABASE_USERNAME", ENV["USER"]) %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

test:
  <<: *default
  database: progress_tracker_test
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", ENV["USER"]) %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

production:
  <<: *default
  database: progress_tracker_production
  username: progress_tracker
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: progress_tracker-db
  port: 5432